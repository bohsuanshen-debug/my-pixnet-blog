<script type="text/javascript">
(function() {
  // 1. 設定新網站根網址 (若日後有自訂獨立網域，直接修改此處即可，結尾請勿帶斜線)
  var NEW_DOMAIN = "https://my-pixnet-blog.vercel.app";
  var PATH_PREFIX = "/posts/";

  // 2. 痞客邦 58 篇已遷移文章對照字典 (由 redirect_map.json 萃取)
  var MAPPING = {"12227278120":"12227278120","12226689583":"12226689583","12226616800":"12226616800","12226616779":"12226616779","12226572925":"12226572925","12226562818":"12226562818","12226449508":"12226449508","12226378522":"12226378522","12226372417":"12226372417","12226372603":"12226372603","12226372606":"12226372606","12226372609":"12226372609","12226372612":"12226372612","12226372615":"12226372615","12226372621":"12226372621","12226372624":"12226372624","12226372627":"12226372627","12226372630":"12226372630","12226372633":"12226372633","12226372636":"12226372636","12226372639":"12226372639","12226372642":"12226372642","12226372645":"12226372645","12226372648":"12226372648","12226372651":"12226372651","12226372654":"12226372654","12226372657":"12226372657","12226372660":"12226372660","12226372663":"12226372663","12226372666":"12226372666","12226372669":"12226372669","12226372672":"12226372672","12226372675":"12226372675","12226372678":"12226372678","12226372681":"12226372681","12226372684":"12226372684","12226372687":"12226372687","12226372690":"12226372690","12226372693":"12226372693","12226372696":"12226372696","12226372699":"12226372699","12226372702":"12226372702","12226372705":"12226372705","12226372708":"12226372708","12226372711":"12226372711","12226372714":"12226372714","12226372717":"12226372717","12226372720":"12226372720","12226372723":"12226372723","12226372726":"12226372726","12226372729":"12226372729","12226372732":"12226372732","12226372735":"12226372735","12226372738":"12226372738","12226372741":"12226372741","12226372744":"12226372744","12226372747":"12226372747","12226372750":"12226372750"};

  try {
    var path = window.location.pathname;
    var targetUrl = "";

    // 匹配文章 ID (支援 /blog/post/ 與 /blog/posts/ 及後續可能帶有的標題文字)
    var match = path.match(/\/blog\/posts?\/(\d+)/i);
    if (match && match[1]) {
      var oldId = match[1];
      if (MAPPING[oldId]) {
        targetUrl = NEW_DOMAIN + PATH_PREFIX + MAPPING[oldId];
      }
    } else if (path === "/" || path === "/blog" || path === "/blog/") {
      // 若訪客造訪痞客邦部落格首頁，自動跳轉至新站首頁
      targetUrl = NEW_DOMAIN;
    }

    if (targetUrl) {
      // A. 動態注入 Canonical 標籤通知 Google 爬蟲「新網站才是正式正本」(SEO 權重轉移核心)
      var canonical = document.querySelector("link[rel='canonical']") || document.createElement("link");
      canonical.rel = "canonical";
      canonical.href = targetUrl;
      if (!canonical.parentNode && document.head) {
        document.head.appendChild(canonical);
      }

      // B. 採用 location.replace() 瞬時跳轉 (不佔用瀏覽器上一頁紀錄，防止上一頁無限迴圈)
      window.location.replace(targetUrl);
    }
  } catch (e) {
    // 容錯防護
  }
})();
</script>
